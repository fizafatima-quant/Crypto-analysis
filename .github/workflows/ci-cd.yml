name: CI

on:
  push:
    branches: [ trading-assistant ]
  pull_request:
    branches: [ trading-assistant ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # extra safety to ensure pytest + libs are always available
        pip install pytest pycoingecko pyTelegramBotAPI

    - name: Set environment variables
      run: |
        echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> $GITHUB_ENV
        echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> $GITHUB_ENV
        echo "TRADE_MODE=paper" >> $GITHUB_ENV

    - name: Run tests
      run: |
        python -m pytest -q || python -m pytest -q -k "ml_mev_adjuster or arbitrage"
